name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
      - run: for f in cv/data/example*.yaml; do python tools/build_cv.py "$f" -o "cv/out/$(basename "$f" .yaml)" --pdf; done
      - uses: actions/upload-artifact@v4
        with:
          name: example-cvs
          path: cv/out/
